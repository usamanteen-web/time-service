<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Dashboard · Time Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Roboto:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;
  --p:#3BBBE6;--p50:#EBF8FD;--p100:#D8F1FA;--p200:#B1E4F5;--p300:#89D5F0;--p400:#62C9EB;--p700:#2F96B8;--p800:#23708A;--p900:#184B5C;
  --text:#4F4F4F;--text-2:#727272;--muted:#959595;--ph:#B9B9B9;--border:#DCDCDC;--divider:#EBEBEB;--subtle:#F9FAFB;--surface:#FFFFFF;
  --ok:#0CA36A;--ok-bg:#ECFDF3;--ok-line:#9EDAC3;--bad:#AE2025;--bad-bg:#FFF3F3;--bad-line:#DFA6A8;
  --s1:#1577A3;--s2:#D9A000;--s3:#3BBBE6;
  --shadow-card:rgba(32,32,32,.06) 0 4px 14px -2px,rgba(32,32,32,.03) 0 2px 8px -2px;
  --shadow-xs:rgba(32,32,32,.05) 0 1px 8px 0;
  --shadow-float:rgba(32,32,32,.08) 0 20px 24px -4px,rgba(32,32,32,.13) 0 8px 8px -4px;
  --sans:Roboto,Prompt,system-ui,-apple-system,"Segoe UI","Noto Sans Thai",Tahoma,sans-serif}
*{box-sizing:border-box}
html{background:var(--surface)}
body{margin:0;background:var(--surface);color:var(--text);font:16px/21px var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--p)}
:focus-visible{outline:2px solid var(--p400);outline-offset:2px}
.ic{display:block;flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar + loader */
.bar{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:72px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--divider)}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:rgba(0,0,0,.54);transition:background .15s cubic-bezier(.4,0,.2,1)}
.iconbtn:hover{background:rgba(0,0,0,.04)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;text-decoration:none;color:var(--text)}
.logo img{width:32px;height:32px;border-radius:50%}
.logo b{font-size:18px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.logo span{color:var(--p);font-size:18px;font-weight:500;white-space:nowrap}
.avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--p50);border:.5px solid rgba(114,114,114,.08);color:var(--p);font-size:14px;font-weight:700;transition:box-shadow .15s}
.avatar:hover,.avatar[aria-expanded=true]{box-shadow:var(--p50) 0 0 0 4px}
.menu{position:absolute;top:64px;right:16px;z-index:35;min-width:220px;padding:8px;border-radius:8px;background:#fff;box-shadow:var(--shadow-card),0 0 0 1px var(--divider)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:8px;color:var(--text);font-size:14px;text-align:left}
.menu button:hover{background:var(--subtle)}
.menu .who{padding:8px 12px 10px;border-bottom:1px solid var(--divider);margin-bottom:6px;color:var(--text-2);font-size:14px}
.topload{position:fixed;top:0;left:0;right:0;z-index:40;height:4px;overflow:hidden;background:var(--p200)}
.topload::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:var(--p);animation:run 1.1s cubic-bezier(.4,0,.2,1) infinite}
@keyframes run{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

/* drawer */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);animation:fade .225s}
.drawer{position:fixed;inset:0 auto 0 0;z-index:51;display:flex;flex-direction:column;width:260px;max-width:86vw;padding:16px 12px;background:#fff;border-radius:0 12px 12px 0;box-shadow:rgba(0,0,0,.2) 0 8px 10px -5px,rgba(0,0,0,.14) 0 16px 24px 2px,rgba(0,0,0,.12) 0 6px 30px 5px;animation:slide .3s cubic-bezier(.4,0,.2,1);overflow-y:auto}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(-100%)}}
.drawer:focus{outline:none}
.drawer .logo{justify-content:flex-start;padding:4px 8px 16px}
.dgroup{display:flex;align-items:center;gap:12px;width:100%;height:45px;padding:8px 12px;border-radius:12px;background:var(--p);color:#fff;font-weight:500}
.ditem{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:8px 16px 8px 48px;border-radius:12px;color:var(--text);font-size:16px;text-align:left;text-decoration:none}
.ditem.top{padding-left:12px}
.ditem:hover{background:var(--subtle)}
.ditem[aria-current=page]{background:var(--subtle);color:var(--p);font-weight:500}
.ditem .ic{color:#727272}
.dsep{height:1px;margin:8px 0;background:var(--divider)}

/* page */
.page{max-width:1240px;margin:0 auto;padding:24px 24px 48px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:24px;border-radius:16px;background:var(--ok-bg);box-shadow:var(--shadow-card)}
.banner h2{margin:0;margin-right:auto;font-size:18px;line-height:23px;font-weight:600;color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;height:27px;padding:2px 12px;border-radius:16px;font-size:16px;line-height:21px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);border:1px solid var(--ok-line)}
.chip.off{color:var(--text);border:1px solid var(--ph);background:rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:12px 24px;border-radius:32px;font-size:14px;line-height:18px;font-weight:500;text-decoration:none;white-space:nowrap;transition:background .25s cubic-bezier(.4,0,.2,1),box-shadow .25s}
.btn.primary{background:var(--p);color:#fff}
.btn.primary:hover{background:var(--p700);box-shadow:rgba(0,0,0,.2) 0 2px 4px -1px,rgba(0,0,0,.14) 0 4px 5px 0,rgba(0,0,0,.12) 0 1px 10px 0}
.btn.outline{border:1px solid rgba(59,187,230,.5);background:#fff;color:var(--p)}
.btn.outline:hover{background:var(--p50)}
.btn.neutral{border:1px solid var(--border);background:#fff;color:var(--text)}
.btn.neutral:hover{background:var(--subtle)}
.btn.small{min-height:36px;padding:8px 16px}
.head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px;margin:24px 0}
.head h1{margin:0 0 8px;font-size:25px;line-height:32px;font-weight:500}
.updated{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:14px;line-height:18px}
.refresh{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:var(--text-2)}
.refresh:hover{background:rgba(0,0,0,.04)}
.refresh.spin .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.filters{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;margin-bottom:24px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:32px;overflow:hidden;background:#fff}
.seg button{min-height:42px;padding:0 18px;color:var(--text);font-size:14px;font-weight:500}
.seg button+button{border-left:1px solid var(--border)}
.seg button:hover{background:var(--subtle)}
.seg button[aria-pressed=true]{background:var(--p);color:#fff}
.range{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--border);border-radius:32px;background:#fff;box-shadow:var(--shadow-xs);color:var(--text-2)}
.range input{min-width:0;border:0;background:transparent;color:var(--text);font-size:14px;padding:6px 0}
.range input:focus{outline:none}
.range:focus-within{border-color:var(--p400);box-shadow:var(--p50) 0 0 0 4px}
.alert{display:flex;align-items:flex-start;gap:10px;margin-bottom:24px;padding:12px 16px;border:1px solid var(--bad-line);border-radius:8px;background:var(--bad-bg);color:var(--bad);font-size:14px;line-height:20px}

/* cards & grids */
.card{min-width:0;padding:24px;border:2px solid var(--divider);border-radius:16px;background:#fff}
.stack{display:grid;gap:24px}
.g48{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:24px}
.g11{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.chead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 16px;margin-bottom:20px}
.chead h3{margin:0;font-size:18px;line-height:23px;font-weight:600}
.chead p{margin:6px 0 0;color:var(--text-2);font-size:14px;line-height:18px}
.legend{display:inline-flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;padding:4px 12px;border-radius:16px;background:var(--subtle);font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dash{display:inline-block;width:16px;height:0;border-top:2px dashed;flex-shrink:0}
.bgroup{display:inline-flex}
.bgroup button{display:grid;place-items:center;width:50px;height:38px;border:1px solid var(--border);color:var(--text-2)}
.bgroup button:first-child{border-radius:24px 0 0 24px}
.bgroup button:last-child{border-radius:0 24px 24px 0;border-left:0}
.bgroup button[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}

/* KPIs */
.kcard{padding:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{display:flex;gap:16px;min-width:0;padding:24px}
.kpi:not(:nth-child(3n+1)){border-left:1px solid var(--divider)}
.kpi:nth-child(n+4){border-top:1px solid var(--divider)}
.kicon{display:grid;place-items:center;flex-shrink:0;width:52px;height:52px;border-radius:28px;background:var(--p50);color:var(--p)}
.kbody{min-width:0}
.klabel{display:flex;align-items:center;gap:6px;font-size:16px;line-height:21px}
.info{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;color:var(--text-2)}
.kvalue{margin:4px 0 6px;font-size:31px;line-height:40px;font-weight:500;font-variant-numeric:tabular-nums}
.delta{display:flex;flex-wrap:wrap;gap:0 6px;color:var(--text-2);font-size:14px;line-height:18px}
.delta b{font-weight:500;white-space:nowrap}
.delta.up b{color:var(--ok)}
.delta.down b{color:var(--bad)}
.delta span{white-space:nowrap}

/* tabs */
.tabs{display:flex;gap:32px;margin:32px 0 24px;border-bottom:1px solid var(--divider);overflow-x:auto;scrollbar-width:none}
.tabs button{flex-shrink:0;padding:10px 0 12px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--text);font-size:18px;line-height:23px;transition:color .3s}
.tabs button[aria-selected=true]{color:var(--p);font-weight:600;border-bottom-color:var(--p400)}
.tabs button:hover{color:var(--p)}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.axis{fill:var(--text);font-size:12px}
.axis-title{fill:var(--text-2);font-size:12px}
.tip{position:fixed;z-index:60;pointer-events:none;min-width:170px;max-width:300px;padding:12px 14px;border:1px solid var(--divider);border-radius:8px;background:#fff;box-shadow:var(--shadow-float);font-size:14px;line-height:18px;color:var(--text)}
.tip[hidden]{display:none}
.tip .t{margin-bottom:8px;color:var(--text-2)}
.tip .r{display:flex;align-items:center;gap:8px;margin-top:6px}
.tip .v{margin-left:auto;padding-left:16px;font-weight:500;font-variant-numeric:tabular-nums}
.tip.dark{min-width:0;padding:8px 12px;border:0;background:#192233;color:#fff}
.tip.dark .t{margin:0;color:#fff}

/* donut */
.donut{display:flex;flex-direction:column;align-items:center;gap:20px}
.donut svg{width:160px;height:160px}
.donut .center-v{font-size:25px;font-weight:500;fill:var(--text)}
.donut .center-s{font-size:13px;fill:var(--text-2)}
.dlegend{display:grid;gap:4px;width:100%}
.dlegend div{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px}
.dlegend div:hover{background:var(--subtle)}
.dlegend b{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}
.dlegend small{color:var(--text-2);font-size:14px;margin-left:4px}

/* status rows (Ticket Type Status style) */
.slist{display:grid}
.srow{display:grid;grid-template-columns:minmax(110px,1.1fr) minmax(80px,1.4fr) 52px minmax(64px,auto);align-items:center;gap:16px;width:100%;min-height:68px;padding:12px 16px;border-top:1px solid var(--divider);text-align:left}
.slist .srow:first-child{border-top:0}
button.srow:hover{background:var(--subtle)}
button.srow[aria-pressed=true]{background:var(--p50);box-shadow:inset 3px 0 0 var(--p)}
.sname{min-width:0}
.sname strong{display:block;overflow:hidden;font-weight:400;text-overflow:ellipsis;white-space:nowrap}
.sname small{display:block;margin-top:2px;color:var(--text-2);font-size:14px;line-height:18px}
.strack{height:8px;border-radius:8px;background:var(--divider)}
.sfill{height:8px;border-radius:8px;background:var(--p)}
.spct{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.snum{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.snum b{font-weight:500}
.snum small{color:var(--text-2);font-size:14px;margin-left:3px}
.slist.compact .srow{grid-template-columns:minmax(0,1fr) auto auto;gap:8px 12px;min-height:0;padding:12px}
.slist.compact .strack{grid-column:1/-1;grid-row:2}
.bigline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
.bigline .kvalue{margin:4px 0 0}

/* rank rows (Visitor Country style) */
.rlist{display:grid;gap:4px}
.rrow{display:grid;grid-template-columns:minmax(96px,34%) minmax(60px,1fr) 44px minmax(52px,auto);align-items:center;gap:14px;padding:8px 0}
.rrow .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtrack{height:8px;border-radius:5px;background:var(--divider)}
.rfill{height:8px;border-radius:5px}
.rrow .pct{color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.rrow .num{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.more{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 4px;color:var(--p);font-size:14px;font-weight:500}

/* heatmap */
.heat{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px}
.heat div{height:64px;border-radius:4px;background:var(--subtle);box-shadow:inset 0 0 0 1px var(--divider)}
.haxis{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;margin-top:8px;color:var(--text);font-size:12px;text-align:center}
.peaks{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:1px solid var(--p200);border-radius:16px;background:var(--p50);color:var(--p800);font-size:14px}
.pchip b{font-weight:500}

/* tables */
.twrap{overflow-x:auto;border:1px solid var(--border);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:14px;line-height:18px}
th{padding:12px 16px;background:var(--subtle);color:var(--text-2);font-weight:500;text-align:left;white-space:nowrap}
td{padding:14px 16px;border-top:1px solid var(--divider);vertical-align:top}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
td.msg{min-width:200px;max-width:420px;white-space:pre-line;overflow-wrap:anywhere}
tr.group td{background:var(--p50);font-weight:500}
tr.total td{background:var(--p50);font-weight:500}
td .sub{display:block;margin-top:2px;color:var(--text-2)}
.copy{display:inline-grid;place-items:center;width:28px;height:28px;margin:-6px 0 -6px 4px;border-radius:50%;color:var(--text-2);vertical-align:middle}
.copy:hover{background:rgba(0,0,0,.04);color:var(--p)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.search{display:inline-flex;align-items:center;gap:8px;flex:1 1 240px;max-width:360px;min-height:44px;padding:0 16px;border:1px solid var(--border);border-radius:32px;color:var(--text-2)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:14px;color:var(--text)}
.search input::placeholder{color:var(--ph)}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--p400);box-shadow:var(--p50) 0 0 0 4px}
.toolbar .btn{margin-left:auto}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;font-size:14px}
.pager .pages{display:flex;gap:4px}
.pager .pages button,.pager .pages span{display:grid;place-items:center;width:40px;height:40px;border-radius:20px;color:var(--text)}
.pager .pages button[aria-current=page]{background:var(--p50);color:var(--p);font-weight:600}
.pager .pages button:hover{background:var(--subtle)}
.pager .nav{display:inline-flex;align-items:center;gap:6px;padding:8px 4px;color:var(--text);font-weight:500}
.pager .nav:disabled{color:var(--muted);cursor:default}

/* empty, skeleton, login, footer */
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:32px 16px;text-align:center}
.empty .art{display:grid;place-items:center;width:88px;height:88px;margin-bottom:10px;border-radius:50%;background:var(--p50);color:var(--p);box-shadow:var(--p100) 0 0 0 10px}
.empty strong{font-size:18px;line-height:23px;font-weight:600}
.empty p{max-width:420px;margin:0;color:var(--text-2);font-size:14px;line-height:20px}
.sk{display:block;border-radius:4px;background:linear-gradient(90deg,#F1EFEF -24.18%,#F9F8F8 50.26%,#E7E5E5 114.84%);background-size:200% 100%;animation:sk 1.6s ease-in-out infinite}
@keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}
.login{max-width:440px;margin:10vh auto 0;padding:32px;border:1px solid var(--divider);border-radius:16px;background:#fff;box-shadow:var(--shadow-card)}
.login img{display:block;width:56px;height:56px;margin-bottom:20px;border-radius:50%}
.login h2{margin:0 0 6px;font-size:20px;line-height:25px;font-weight:500}
.login p{margin:0 0 20px;color:var(--text-2);font-size:14px;line-height:20px}
.login label{display:block;margin-bottom:6px;font-size:14px;font-weight:500}
.login input{width:100%;margin-bottom:20px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:16px;box-shadow:rgba(16,24,40,.05) 0 1px 2px 0}
.login input:focus{outline:none;border-color:var(--p400);box-shadow:var(--p50) 0 1px 2px 0,var(--p50) 0 0 0 4px}
.login .btn{width:100%}
.login .err{margin:-8px 0 16px;color:var(--bad);font-size:14px}
footer{margin-top:32px;padding-top:20px;border-top:1px solid var(--divider);color:var(--text-2);font-size:14px;line-height:22px}
footer label{display:inline-flex;align-items:center;gap:10px;margin-bottom:8px;color:var(--text)}
footer input{width:18px;height:18px;accent-color:var(--p)}

@media(max-width:1024px){.g48,.g11{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:not(:nth-child(3n+1)){border-left:0}
  .kpi:nth-child(n+4){border-top:0}
  .kpi:nth-child(even){border-left:1px solid var(--divider)}
  .kpi:nth-child(n+3){border-top:1px solid var(--divider)}
  .kpi{flex-direction:column;gap:10px;padding:16px}
  .kicon{width:40px;height:40px}
  .kvalue{font-size:26px;line-height:32px}
  .delta span{white-space:normal}
  .logo span{display:none}
}
@media(max-width:640px){
  .page{padding:16px 16px 40px}
  .card{padding:16px}
  .banner{padding:16px}
  .head .btn{width:100%}
  .filters>*{width:100%}
  .seg{display:grid;grid-template-columns:repeat(4,1fr)}
  .seg button{padding:0 6px}
  .range{justify-content:space-between}
  .srow{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px}
  .srow .strack{grid-column:1/-1;grid-row:2}
  .srow .spct{display:none}
  .rrow{grid-template-columns:minmax(80px,38%) minmax(40px,1fr) 40px auto;gap:10px}

const h = (tag, props, ...kids) => {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(props || {})) {
    if (value == null || value === false) continue;
    if (name === 'class') node.className = value;
    else if (name === 'text') node.textContent = value;
    else if (name.startsWith('on')) node.addEventListener(name.slice(2), value);
    else node.setAttribute(name, value === true ? '' : value);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return node;
};
const s = (tag, props, ...kids) => {
  const node = document.createElementNS(NS, tag);
  for (const [name, value] of Object.entries(props || {})) if (value != null) node.setAttribute(name, value);
  for (const kid of kids.flat()) if (kid) node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));

};

// ---------- tooltips ----------
function placeTip(x, y) {
  const box = tip.getBoundingClientRect();
  tip.style.left = `${Math.max(8, Math.min(innerWidth - box.width - 8, x + 14))}px`;
  tip.style.top = `${Math.max(8, Math.min(innerHeight - box.height - 8, y + 14))}px`;
}
function showTip(point, title, rows) {
  tip.className = 'tip';
  tip.replaceChildren(h('div', { class: 't', text: title }), ...rows.map((row) => h('div', { class: 'r' },
    row.color ? (row.dashed ? h('span', { class: 'dash', style: `border-color:${row.color}` }) : h('span', { class: 'dot', style: `background:${row.color}` })) : null,
    h('span', { text: row.label }), h('span', { class: 'v', text: row.value }))));
  tip.hidden = false;
  placeTip(point.clientX ?? 0, point.clientY ?? 0);
}
function showNote(node, text) {
  tip.className = 'tip dark';
  tip.replaceChildren(h('div', { class: 't', text }));
  tip.hidden = false;
  const rect = node.getBoundingClientRect();
  placeTip(rect.left, rect.bottom);
}
const hideTip = () => { tip.hidden = true; };
function attachTip(node, content) {
  const show = (event) => {
    const rect = node.getBoundingClientRect();
    const point = event.type === 'focus' ? { clientX: rect.left + rect.width / 2, clientY: rect.top } : event;
    const [title, rows] = content();
    showTip(point, title, rows);
  };
  node.addEventListener('pointermove', show);
  node.addEventListener('focus', show);
  node.addEventListener('pointerleave', hideTip);
  node.addEventListener('blur', hideTip);
}
function infoButton(text) {
  const button = h('button', { class: 'info', type: 'button', 'aria-label': text }, icon('info', 16));
  const show = () => showNote(button, text);
  button.addEventListener('pointerenter', show);
  button.addEventListener('focus', show);
  button.addEventListener('click', show);
  button.addEventListener('pointerleave', hideTip);
  button.addEventListener('blur', hideTip);
  return button;
}

// ---------- building blocks ----------
function delta(current, previous) {
  if (!previous && !current) return h('div', { class: 'delta' }, h('span', { text: 'ยังไม่มีข้อมูล' }));
  if (!previous) return h('div', { class: 'delta up' }, h('b', { text: '▲ ใหม่' }), h('span', { text: 'ช่วงก่อนหน้าเป็น 0' }));
  const change = Math.round(((current - previous) / previous) * 100);
  if (change === 0) return h('div', { class: 'delta' }, h('b', { text: '= 0%' }), h('span', { text: 'เท่ากับช่วงก่อนหน้า' }));
  return h('div', { class: `delta ${change > 0 ? 'up' : 'down'}` }, h('b', { text: `${change > 0 ? '▲ +' : '▼ '}${change}%` }), h('span', { text: `จากช่วงก่อนหน้า (${nf.format(previous)})` }));
}

function kpi(iconName, label, value, previous, note) {

      previous === undefined ? null : delta(value, previous)));
}

function emptyBox(title, text) {

function viewToggle(key) {

    h('button', { type: 'button', 'aria-pressed': String(!state.tables[key]), 'aria-label': 'ดูเป็นกราฟ', title: 'ดูเป็นกราฟ', onclick: () => set(false) }, icon(key === 'clicks' ? 'list' : 'chart')),
    h('button', { type: 'button', 'aria-pressed': String(Boolean(state.tables[key])), 'aria-label': 'ดูเป็นตาราง', title: 'ดูเป็นตาราง', onclick: () => set(true) }, icon('table')));

function cardHead(title, sub, extra, right) {

function legend(items) {

function table(headers, rows, options = {}) {
  return h('div', { class: 'twrap' }, h('table', null,

    h('tbody', null, rows.map((row) => {
      const cells = row.cells || row;
      return h('tr', { class: row.kind || null }, cells.map((cell, i) => h('td', { class: headers[i].numeric ? 'n' : headers[i].msg ? 'msg' : null }, cell)));
    }), options.total ? h('tr', { class: 'total' }, options.total.map((cell, i) => h('td', { class: headers[i].numeric ? 'n' : null, text: cell }))) : null)));
}

function moreButton(key, total, limit) {
  if (total <= limit) return null;
  const open = Boolean(state.more[key]);
  return h('button', { class: 'more', type: 'button', 'aria-expanded': String(open), onclick: () => { state.more[key] = !open; draw(); } },
    open ? 'ดูน้อยลง' : `ดูเพิ่มเติม (${total - limit})`, icon(open ? 'up' : 'down', 16));
}

// Ticket-type-status style rows: name, bar, percent, count
function statusList(rows, options) {
  const total = options.total || rows.reduce((sum, row) => sum + row.value, 0);
  const max = Math.max(1, ...rows.map((row) => row.value));
  return h('div', { class: options.compact ? 'slist compact' : 'slist' }, rows.map((row) => {
    const interactive = Boolean(options.onSelect);
    const node = h(interactive ? 'button' : 'div', { class: 'srow', type: interactive ? 'button' : null, tabindex: interactive ? null : 0, 'aria-pressed': interactive ? String(options.selected === row.key) : null },
      h('span', { class: 'sname' }, h('strong', { text: row.label, title: row.label }), row.sub ? h('small', { text: row.sub }) : null),
      h('span', { class: 'strack' }, h('span', { class: 'sfill', style: `display:block;width:${Math.max(2, (row.value / max) * 100)}%` })),
      h('span', { class: 'spct', text: pct(row.value, total) }),
      h('span', { class: 'snum' }, h('b', { text: nf.format(row.value) }), h('small', { text: options.unit })));
    if (interactive) node.addEventListener('click', () => options.onSelect(row.key));
    attachTip(node, () => [row.label, [{ label: options.unit, value: nf.format(row.value), color: '#3BBBE6' }, { label: 'สัดส่วน', value: pct(row.value, total) }, ...(row.extra || [])]]);
    return node;
  }));
}

// Visitor-country style rows: color steps darker as the value grows
function rankList(rows, options) {
  const total = rows.reduce((sum, row) => sum + row.value, 0);
  const max = Math.max(1, ...rows.map((row) => row.value));
  const limit = options.limit || 8;

  return h('div', null, h('div', { class: 'rlist' }, shown.map((row) => {

    return node;

// ---------- charts ----------
function niceStep(max) {
  const raw = Math.max(1, max / 4);
  const pow = 10 ** Math.floor(Math.log10(raw));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * pow >= raw) return Math.max(1, Math.ceil(m * pow));
  return pow * 10;
}

function responsive(render) {
  const box = h('div', { class: 'chart' });
  const observer = new ResizeObserver(() => {
    if (!box.isConnected) { observer.disconnect(); return; }
    clearTimeout(box._t);
    box._t = setTimeout(() => render(box), 80);
  });
  observer.observe(box);
  queueMicrotask(() => render(box));
  return box;
}

const SERIES = [
  { key: 'visits', label: 'การเข้าชม', color: '#1577A3' },
  { key: 'visitors', label: 'ผู้เข้าชม', color: '#D9A000', dashed: true },
];

function dailyChart(daily) {
  return responsive((box) => {
    const W = Math.max(280, Math.floor(box.clientWidth || 640)), H = 300, m = { l: 48, r: 14, t: 26, b: 52 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b, n = daily.length;
    const step = niceStep(Math.max(1, ...daily.map((d) => Math.max(d.visits, d.visitors))));
    const top = step * 4;
    const x = (i) => m.l + (n === 1 ? iw / 2 : (i * iw) / (n - 1));
    const y = (v) => m.t + ih - (v / top) * ih;
    const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', tabindex: 0, 'aria-label': `กราฟการเข้าชมและผู้เข้าชมรายวัน ${n} วัน ใช้ลูกศรซ้ายขวาเพื่ออ่านค่าแต่ละวัน` });
    svg.append(s('text', { x: 0, y: 10, class: 'axis-title' }, '(ครั้ง)'));
    for (let i = 0; i <= 4; i += 1) {
      const gy = y(i * step);
      svg.append(s('line', { x1: m.l, x2: W - m.r, y1: gy, y2: gy, stroke: i === 0 ? '#DCDCDC' : '#EBEBEB', 'stroke-width': 1 }));
      svg.append(s('text', { x: m.l - 10, y: gy + 4, 'text-anchor': 'end', class: 'axis' }, tick(i * step)));
    }
    const labels = Math.min(n, W < 520 ? 4 : 8);
    for (let i = 0; i < labels; i += 1) {
      const index = labels === 1 ? 0 : Math.round((i * (n - 1)) / (labels - 1));
      svg.append(s('text', { x: x(index), y: m.t + ih + 20, 'text-anchor': index === 0 && n > 1 ? 'start' : index === n - 1 && n > 1 ? 'end' : 'middle', class: 'axis' }, dayShort.format(asDate(daily[index].day))));
    }
    svg.append(s('text', { x: m.l + iw / 2, y: H - 4, 'text-anchor': 'middle', class: 'axis-title' }, '(วันที่)'));
    const cross = s('line', { y1: m.t, y2: m.t + ih, stroke: '#B9B9B9', 'stroke-width': 1, 'stroke-dasharray': '4 4', visibility: 'hidden' });
    svg.append(cross);
    const dots = SERIES.map((series) => {
      const points = daily.map((d, i) => `${x(i)},${y(d[series.key])}`);
      if (n > 1) svg.append(s('polyline', { points: points.join(' '), fill: 'none', stroke: series.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'stroke-dasharray': series.dashed ? '10 5' : null }));
      svg.append(s('circle', { cx: x(n - 1), cy: y(daily[n - 1][series.key]), r: 4, fill: series.color, stroke: '#fff', 'stroke-width': 2 }));
      const dot = s('circle', { r: 5, fill: series.color, stroke: '#fff', 'stroke-width': 2, visibility: 'hidden' });
      return dot;
    });
    dots.forEach((dot) => svg.append(dot));
    const hit = s('rect', { x: m.l - 8, y: m.t, width: iw + 16, height: ih + 8, fill: 'transparent' });
    svg.append(hit);
    let current = n - 1;
    const focusAt = (index, event) => {
      current = Math.max(0, Math.min(n - 1, index));
      const d = daily[current];
      cross.setAttribute('x1', x(current)); cross.setAttribute('x2', x(current)); cross.setAttribute('visibility', 'visible');
      SERIES.forEach((series, i) => { dots[i].setAttribute('cx', x(current)); dots[i].setAttribute('cy', y(d[series.key])); dots[i].setAttribute('visibility', 'visible'); });
      const rect = svg.getBoundingClientRect();
      const point = event && event.clientX != null ? event : { clientX: rect.left + x(current), clientY: rect.top + y(d.visits) };
      showTip(point, dayLong.format(asDate(d.day)), [
        ...SERIES.map((series) => ({ label: series.label, value: nf.format(d[series.key]), color: series.color, dashed: series.dashed })),
        { label: 'ยอดดูหน้า', value: nf.format(d.pageviews) },
      ]);
    };
    const clear = () => { cross.setAttribute('visibility', 'hidden'); dots.forEach((dot) => dot.setAttribute('visibility', 'hidden')); hideTip(); };
    hit.addEventListener('pointermove', (event) => { const rect = svg.getBoundingClientRect(); focusAt(n === 1 ? 0 : Math.round(((event.clientX - rect.left - m.l) / iw) * (n - 1)), event); });
    hit.addEventListener('pointerleave', clear);
    svg.addEventListener('focus', () => focusAt(current));
    svg.addEventListener('blur', clear);
    svg.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') { event.preventDefault(); focusAt(current - 1); }
      if (event.key === 'ArrowRight') { event.preventDefault(); focusAt(current + 1); }
    });
    box.replaceChildren(svg);
  });
}

function ringPath(r0, r1, a0, a1) {
  const p = (r, a) => `${80 + r * Math.sin(a)},${80 - r * Math.cos(a)}`;
  if (a1 - a0 >= Math.PI * 2 - 1e-6) return `${ringPath(r0, r1, 0, Math.PI)} ${ringPath(r0, r1, Math.PI, Math.PI * 2)}`;
  const large = a1 - a0 > Math.PI ? 1 : 0;
  return `M${p(r1, a0)} A${r1},${r1} 0 ${large} 1 ${p(r1, a1)} L${p(r0, a1)} A${r0},${r0} 0 ${large} 0 ${p(r0, a0)} Z`;
}

function donut(parts, unit) {
  const total = parts.reduce((sum, part) => sum + part.value, 0);
  const lead = [...parts].sort((a, b) => b.value - a.value)[0];
  const svg = s('svg', { viewBox: '0 0 160 160', role: 'img', 'aria-label': parts.map((part) => `${part.label} ${part.value} (${pct(part.value, total)})`).join(', ') });
  let angle = 0;
  for (const part of parts) {
    if (!part.value) continue;
    const sweep = (part.value / total) * Math.PI * 2;
    const arc = s('path', { d: ringPath(60, 80, angle, angle + sweep), fill: part.color, stroke: '#fff', 'stroke-width': parts.filter((p) => p.value).length > 1 ? 2 : 0 });
    attachTip(arc, () => [part.label, [{ label: unit, value: `${nf.format(part.value)} (${pct(part.value, total)})`, color: part.color }]]);
    svg.append(arc);
    angle += sweep;
  }
  svg.append(s('text', { x: 80, y: 80, 'text-anchor': 'middle', class: 'center-v' }, pct(lead.value, total)));
  svg.append(s('text', { x: 80, y: 100, 'text-anchor': 'middle', class: 'center-s' }, lead.label));
  return h('div', { class: 'donut' }, svg, h('div', { class: 'dlegend' }, parts.map((part) => {
    const row = h('div', { tabindex: 0 }, h('span', { class: 'dot', style: `background:${part.color}` }), h('span', { text: part.label }),
      h('b', null, nf.format(part.value), h('small', { text: `(${pct(part.value, total)})` })));
    attachTip(row, () => [part.label, [{ label: unit, value: `${nf.format(part.value)} (${pct(part.value, total)})`, color: part.color }]]);
    return row;
  })));
}

function leadsCard(data) {
  const perPage = 10;
  const holder = h('div');
  const render = () => {
    const query = state.leadQuery.trim().toLowerCase();
    const rows = query ? data.leads.filter((l) => [l.name, l.contact, l.message, l.path].some((v) => String(v || '').toLowerCase().includes(query))) : data.leads;
    const pages = Math.max(1, Math.ceil(rows.length / perPage));
    state.leadPage = Math.min(state.leadPage, pages);
    const slice = rows.slice((state.leadPage - 1) * perPage, state.leadPage * perPage);
    const go = (page) => { state.leadPage = page; render(); };
    const numbers = [];
    for (let page = 1; page <= pages; page += 1) {
      if (pages <= 7 || page === 1 || page === pages || Math.abs(page - state.leadPage) <= 1) numbers.push(page);
      else if (numbers[numbers.length - 1] !== '…') numbers.push('…');
    }
    holder.replaceChildren(...[
      rows.length
        ? table([{ text: 'วันเวลา' }, { text: 'ชื่อ' }, { text: 'ติดต่อ' }, { text: 'รายละเอียด', msg: true }, { text: 'หน้าเว็บ' }],
          slice.map((l) => [stamp.format(new Date(l.ts * 1000)), l.name, h('span', null, l.contact, copyButton(l.contact)), l.message || '-', l.path || '-']))
        : emptyBox(query ? 'ไม่พบข้อมูลที่ค้นหา' : 'ยังไม่มีคนฝากข้อมูลในช่วงนี้', query ? 'ลองพิมพ์คำอื่น' : 'ลูกค้าที่กรอกฟอร์ม “ขอใบเสนอราคา” ในแชทบอทจะมาแสดงที่นี่'),
      pages > 1 ? h('nav', { class: 'pager', 'aria-label': 'เปลี่ยนหน้า' },
        h('button', { class: 'nav', type: 'button', disabled: state.leadPage === 1 ? true : null, onclick: () => go(state.leadPage - 1) }, icon('left', 18), h('span', { text: 'ก่อนหน้า' })),
        h('div', { class: 'pages' }, numbers.map((page) => (page === '…' ? h('span', { text: '…' }) : h('button', { type: 'button', 'aria-current': page === state.leadPage ? 'page' : null, onclick: () => go(page), text: String(page) })))),
        h('button', { class: 'nav', type: 'button', disabled: state.leadPage === pages ? true : null, onclick: () => go(state.leadPage + 1) }, h('span', { text: 'ถัดไป' }), icon('right', 18))) : null,
    ].filter(Boolean));
  };
  const exportCsv = () => {
    const lines = [['วันเวลา', 'ชื่อ', 'ติดต่อ', 'รายละเอียด', 'หน้าเว็บ'], ...data.leads.map((l) => [stamp.format(new Date(l.ts * 1000)), l.name, l.contact, l.message, l.path])];
    downloadCsv(lines, `leads-${data.range.from}_${data.range.to}.csv`);

  const search = h('label', { class: 'search' }, icon('search', 18), h('span', { class: 'sr', text: 'ค้นหาลูกค้า' }),
    h('input', { type: 'search', placeholder: 'ค้นหาชื่อ เบอร์ หรือข้อความ', value: state.leadQuery, oninput: (event) => { state.leadQuery = event.target.value; state.leadPage = 1; render(); } }));
  render();
  return h('section', { class: 'card' },
    cardHead('ลูกค้าที่ฝากข้อมูลไว้', `${nf.format(data.leads.length)} รายการ · จากฟอร์ม “ขอใบเสนอราคา” ในแชทบอท`),

    holder);
}

// ---------- page ----------
function downloadCsv(lines, filename) {
  const esc = (value) => `"${String(value ?? '').replace(/"/g, '""')}"`;
  const blob = new Blob([`﻿${lines.map((line) => line.map(esc).join(',')).join('\n')}`], { type: 'text/csv;charset=utf-8' });
  const link = h('a', { href: URL.createObjectURL(blob), download: filename });
  document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

function exportReport() {
  const data = state.data;
  if (!data) return;
  const lines = [
    ['รายงานสถิติเว็บไซต์ timeservices.co', `${data.range.from} ถึง ${data.range.to}`], [],
    ['วันที่', 'การเข้าชม', 'ผู้เข้าชม', 'ยอดดูหน้า'], ...data.daily.map((d) => [d.day, d.visits, d.visitors, d.pageviews]), [],
    ['หมวด', 'รายการ', 'คลิก', 'จำนวนคน'], ...data.clicks.map((c) => [CATEGORY_NAMES[c.category] || c.category, c.item, c.n, c.people]), [],
    ['หน้า', 'ยอดดูหน้า', 'ผู้เข้าชม'], ...data.pages.map((p) => [p.path, p.pageviews, p.visitors]), [],
    ['ที่มา', 'การเข้าชม'], ...data.sources.map((r) => [sourceName(r.name), r.n]),
  ];
  downloadCsv(lines, `report-${data.range.from}_${data.range.to}.csv`);
}

function logout() {
  store.del(KEY_STORE); state.key = ''; state.data = null; state.menu = false; state.drawer = false; draw();
}

function setView(view) {
  state.view = view; state.drawer = false; store.set(VIEW_STORE, view); draw();
  document.getElementById(`tab-${view}`)?.focus({ preventScroll: true });
}

function topBar(withMenu) {
  return h('header', { class: 'bar' },
    withMenu ? h('button', { class: 'iconbtn', type: 'button', 'aria-label': 'เปิดเมนู', 'aria-expanded': String(state.drawer), id: 'hamburger', onclick: () => { state.drawer = true; draw(); } }, icon('menu', 24)) : h('span'),
    h('a', { class: 'logo', href: '/dashboard/' }, h('img', { src: LOGO, alt: '' }), h('b', { text: 'TIME SERVICE' }), h('span', { text: 'Dashboard' })),
    withMenu ? h('button', { class: 'avatar', type: 'button', 'aria-label': 'เมนูบัญชี', 'aria-haspopup': 'menu', 'aria-expanded': String(state.menu), onclick: (event) => { event.stopPropagation(); state.menu = !state.menu; draw(); } }, 'TS') : h('span'));
}

function drawer() {
  const close = () => { state.drawer = false; draw(); document.getElementById('hamburger')?.focus(); };
  return [h('div', { class: 'backdrop', onclick: close }),
    h('nav', { class: 'drawer', 'aria-label': 'เมนูหลัก', tabindex: -1 },
      h('a', { class: 'logo', href: '/dashboard/' }, h('img', { src: LOGO, alt: '' }), h('b', { text: 'TIME SERVICE' })),
      h('div', { class: 'dgroup' }, icon('chart', 22), 'ภาพรวมเว็บไซต์'),
      VIEWS.map(([id, label]) => h('button', { class: 'ditem', type: 'button', 'aria-current': state.view === id ? 'page' : null, onclick: () => setView(id), text: label })),
      h('div', { class: 'dsep' }),
      h('a', { class: 'ditem top', href: '/', target: '_blank', rel: 'noopener' }, icon('home', 22), 'เปิดหน้าเว็บ'),
      h('button', { class: 'ditem top', type: 'button', onclick: () => { state.drawer = false; exportReport(); draw(); } }, icon('download', 22), 'ดาวน์โหลดรายงาน'),
      h('div', { class: 'dsep' }),
      h('button', { class: 'ditem top', type: 'button', onclick: logout }, icon('logout', 22), 'ออกจากระบบ'))];
}

function loginView() {
  const input = h('input', { id: 'key', type: 'password', autocomplete: 'current-password', placeholder: 'ใส่รหัสที่ได้รับ', required: true });
  const form = h('form', { class: 'login', onsubmit: (event) => { event.preventDefault(); state.key = input.value.trim(); store.set(KEY_STORE, state.key); state.error = ''; load(); } },
    h('img', { src: LOGO, alt: 'Time Service' }),
    h('h2', { text: 'เข้าสู่ Dashboard' }), h('p', { text: 'ดูสถิติผู้เข้าชม การคลิก และแชทบอทของ timeservices.co' }),
    h('label', { for: 'key', text: 'รหัส Dashboard' }), input,
    state.error ? h('p', { class: 'err', role: 'alert', text: state.error }) : null,
    h('button', { class: 'btn primary', type: 'submit', text: 'เข้าสู่ระบบ' }));
  app.replaceChildren(topBar(false), h('main', { class: 'page' }, form));
  input.focus();
}

function skeleton() {
  const block = (w, hgt) => h('span', { class: 'sk', style: `width:${w};height:${hgt}px` });
  return h('div', { class: 'stack', 'aria-busy': 'true' },
    h('section', { class: 'card kcard' }, h('div', { class: 'kpis' }, Array.from({ length: 6 }, () => h('div', { class: 'kpi' },
      h('span', { class: 'sk', style: 'width:52px;height:52px;border-radius:50%' }), h('div', { style: 'flex:1;display:grid;gap:10px' }, block('60%', 16), block('40%', 32), block('75%', 14)))))),
    h('section', { class: 'card' }, block('30%', 20), h('div', { style: 'height:16px' }), block('100%', 240)));
}

function dashboardView() {
  const data = state.data;
  const presets = [['1', 'วันนี้'], ['7', '7 วัน'], ['30', '30 วัน'], ['90', '90 วัน']];
  const from = h('input', { type: 'date', value: state.from, max: state.to || null, 'aria-label': 'ตั้งแต่วันที่' });
  const to = h('input', { type: 'date', value: state.to, min: state.from || null, 'aria-label': 'ถึงวันที่' });
  const custom = () => { if (from.value && to.value && from.value <= to.value) { state.preset = 'custom'; state.from = from.value; state.to = to.value; load(); } };
  from.addEventListener('change', custom); to.addEventListener('change', custom);

  const connected = Boolean(data) && !state.error;
  const parts = [
    h('div', { class: 'banner' },
      h('span', { class: `chip ${connected ? 'ok' : 'off'}`, text: connected ? 'กำลังนับ' : 'ยังไม่เชื่อมต่อ' }),
      h('h2', { text: 'TIME SERVICE · timeservices.co' }),
      h('a', { class: 'btn outline', href: '/', target: '_blank', rel: 'noopener' }, icon('external', 18), 'เปิดหน้าเว็บ')),
    h('div', { class: 'head' },
      h('div', null, h('h1', { text: 'ภาพรวมเว็บไซต์' }),
        h('div', { class: 'updated', role: 'status' },
          h('span', { text: state.updated ? `อัปเดตล่าสุด: ${updatedFmt.format(state.updated)}` : 'กำลังโหลด…' }),
          h('button', { class: `refresh${state.loading ? ' spin' : ''}`, type: 'button', 'aria-label': 'รีเฟรช', title: 'รีเฟรช', onclick: () => load() }, icon('refresh', 18)))),
      h('button', { class: 'btn primary', type: 'button', disabled: data ? null : true, onclick: exportReport }, icon('download', 18), 'ดาวน์โหลดรายงาน')),
    h('div', { class: 'filters' },
      h('div', { class: 'seg', role: 'group', 'aria-label': 'ช่วงเวลา' }, presets.map(([value, label]) => h('button', { type: 'button', 'aria-pressed': String(state.preset === value), onclick: () => { state.preset = value; Object.assign(state, rangeFor(value)); load(); }, text: label }))),
      h('div', { class: 'range' }, icon('calendar', 18), from, h('span', { text: '—' }), to)),
  ];
  if (state.error) parts.push(h('div', { class: 'alert', role: 'alert' }, icon('alert', 20), h('span', { text: state.error })));

  if (data) {
    const t = data.totals, p = data.previous;
    parts.push(h('section', { class: 'card kcard', 'aria-label': 'ตัวเลขสรุป' }, h('div', { class: 'kpis' },
      kpi('eye', 'การเข้าชม', t.visits, p.visits, 'จำนวนครั้งที่คนเปิดเว็บเข้ามา (เปิดหลายหน้าในครั้งเดียวนับ 1)'),
      kpi('users', 'ผู้เข้าชม', t.visitors, p.visitors, 'จำนวนคนไม่ซ้ำ นับเป็นรายวัน คนเดิมที่กลับมาวันถัดไปนับใหม่'),
      kpi('file', 'ยอดดูหน้า', t.pageviews, p.pageviews, 'จำนวนหน้าทั้งหมดที่ถูกเปิด'),
      kpi('click', 'การคลิก', t.clicks, p.clicks, 'คลิกผลงาน บริการ ข่าว และช่องทางติดต่อ'),
      kpi('chat', 'เปิดแชทบอท', t.chatOpens, p.chatOpens, 'จำนวนครั้งที่เปิดหน้าต่างแชท'),
      kpi('lead', 'ฝากข้อมูล', t.leads, p.leads, 'ลูกค้าที่กรอกฟอร์มขอใบเสนอราคาในแชทบอท'))));
    const tabs = h('div', { class: 'tabs', role: 'tablist', 'aria-label': 'มุมมอง' }, VIEWS.map(([id, label]) => h('button', {
      id: `tab-${id}`, type: 'button', role: 'tab', 'aria-selected': String(state.view === id), 'aria-controls': 'panel', tabindex: state.view === id ? 0 : -1, onclick: () => setView(id), text: label,
    })));
    tabs.addEventListener('keydown', (event) => {
      const index = VIEWS.findIndex(([id]) => id === state.view);
      if (event.key === 'ArrowRight') setView(VIEWS[(index + 1) % VIEWS.length][0]);
      if (event.key === 'ArrowLeft') setView(VIEWS[(index + VIEWS.length - 1) % VIEWS.length][0]);
    });
    const panel = state.view === 'clicks' ? clicksView(data) : state.view === 'chat' ? chatView(data) : state.view === 'mail' ? mailView() : trafficView(data);
    parts.push(tabs, h('div', { id: 'panel', role: 'tabpanel', 'aria-labelledby': `tab-${state.view}` }, panel));
  } else if (!state.error) {
    parts.push(skeleton());
  }

  const ignored = store.get('ts_ignore') === '1';
  parts.push(h('footer', null,
    h('label', null, h('input', { type: 'checkbox', checked: ignored ? true : null, onchange: (event) => store.set('ts_ignore', event.target.checked ? '1' : '0') }), 'ไม่นับการเข้าเว็บจากเครื่องนี้ (กันยอดของเจ้าของเว็บปนกับลูกค้า)'),
    h('div', { text: 'ไม่ใช้คุกกี้ และไม่เก็บที่อยู่ IP · เวลาทั้งหมดเป็นเวลาไทย · กรองบอทและโปรแกรมสแกนเว็บออกแล้ว' })));

  const view = [state.loading ? h('div', { class: 'topload', 'aria-hidden': 'true' }) : null, topBar(true)];
  if (state.menu) {
    view.push(h('div', { class: 'menu', role: 'menu', onclick: (event) => event.stopPropagation() },
      h('div', { class: 'who', text: 'เจ้าของเว็บไซต์' }),
      h('button', { type: 'button', role: 'menuitem', onclick: logout }, icon('logout', 18), 'ออกจากระบบ')));
  }
  view.push(h('main', { class: 'page' }, parts));
  if (state.drawer) view.push(...drawer());
  app.replaceChildren(...view.filter(Boolean));
  if (state.drawer) app.querySelector('.drawer')?.focus();
}

function draw() {
  hideTip();
  if (!state.key) loginView(); else dashboardView();
}

async function load() {
  if (!state.key) return draw();
  state.loading = true;
  if (!state.from) Object.assign(state, rangeFor(state.preset));
  draw();
  try {
    const response = await fetch(`/api/stats?from=${state.from}&to=${state.to}`, { headers: { Authorization: `Bearer ${state.key}` }, cache: 'no-store' });
    if (response.status === 401) {
      store.del(KEY_STORE); state.key = ''; state.data = null; state.error = 'รหัสไม่ถูกต้อง ลองอีกครั้ง';
    } else if (response.status === 503) {
      state.error = 'เซิร์ฟเวอร์ยังตั้งค่าไม่ครบ (ยังไม่ได้ใส่รหัส DASHBOARD_KEY หรือยังไม่ได้เชื่อมฐานข้อมูล DB)';
    } else if (!response.ok) {
      state.error = `โหลดข้อมูลไม่สำเร็จ (รหัส ${response.status})`;
    } else {
      state.data = await response.json(); state.error = ''; state.updated = new Date();
      try {
        const mail = await fetch(`/api/mail-stats?from=${state.from}&to=${state.to}`, { headers: { Authorization: `Bearer ${state.key}` }, cache: 'no-store' });
        state.mail = mail.ok ? await mail.json() : null;
      } catch { state.mail = null; }
    }
  } catch {
    state.error = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ แสดงข้อมูลล่าสุดที่โหลดไว้';
  }
  state.loading = false;
  draw();
}

document.addEventListener('click', () => { if (state.menu) { state.menu = false; draw(); } });
document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  if (state.drawer) { state.drawer = false; draw(); document.getElementById('hamburger')?.focus(); }
  else if (state.menu) { state.menu = false; draw(); }
});
setInterval(() => { if (state.key && !state.drawer && !state.menu && document.visibilityState === 'visible' && !document.activeElement?.matches('input')) load(); }, 60000);
Object.assign(state, rangeFor(state.preset));
load();
</script>
