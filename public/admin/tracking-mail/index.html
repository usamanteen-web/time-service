<div class="middle"><section class="chart-card glass" tabindex="0" id="chart-card"><div class="chart-top"><div><h2 class="section-title"><svg class="icon chart" aria-hidden="true"><use href="#chart"/></svg>ยอดส่งรายวัน</h2><div class="chart-total"><span class="num" id="chart-total">—</span><span class="unit">ฉบับ</span><span class="chart-note" id="chart-note">—</span></div></div><div class="segments glass" aria-label="ช่วงเวลาของกราฟ"><button data-days="7" aria-pressed="false">7 วัน</button><button data-days="14" class="active" aria-pressed="true">14 วัน</button><button data-days="30" aria-pressed="false">30 วัน</button></div></div><svg id="daily-chart" class="chart-svg" role="img" aria-label="ยอดส่งถึงผู้รับรายวัน" viewBox="0 0 690 209" preserveAspectRatio="none"></svg></section><section class="recent-card glass" tabindex="0"><div class="recent-head"><h2 class="section-title"><svg class="icon send" aria-hidden="true"><use href="#send"/></svg>ส่งล่าสุด</h2><button class="all-link">ดูทั้งหมด <svg class="icon arrow" aria-hidden="true"><use href="#arrow"/></svg></button></div><div class="recent-list"></div></section></div>

<script>

'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const app=$('#app'), sampleParam=new URLSearchParams(location.search).get('sample'), sampleMode=['1','harry'].includes(sampleParam);
const store={get(){try{return localStorage.getItem('ts_dash_key')||''}catch{return ''}},set(v){try{localStorage.setItem('ts_dash_key',v)}catch{}},clear(){try{localStorage.removeItem('ts_dash_key')}catch{}}};
let key=store.get(), payload=null, selectedAccount=sampleParam==='harry'?'harry':'all', selectedDays=14, selectedHarryDays=730, selectedHarryCategory=null, originals={}, controller=null, toastTimer;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=v=>Number.isFinite(Number(v))?Number(v):0;
const fmt=v=>number(v).toLocaleString('en-US');
const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#${n}"/></svg>`;
const months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thaiDate(value,year=false,pad=false){const match=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(!match)return '—';return `${pad?match[3]:Number(match[3])} ${months[Number(match[2])-1]||''}${year?' '+match[1]:''}`}
function thaiTime(value){const t=String(value||'').match(/T(\d{2}:\d{2})/);return `${thaiDate(value,true,true)}${t?' · '+t[1]+' น.':''}`}
const bangkokToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const statuses={sending:['กำลังส่ง','green'],connected:['เชื่อมต่อแล้ว','green'],waiting_domain:['รอโดเมน','amber'],not_connected:['ยังไม่เชื่อมต่อ',''],error:['มีปัญหา','red']};
function status(a){const s=statuses[a?.status]||statuses.not_connected;return `<span class="status ${s[1]}">${s[0]}</span>`}
const titleFor=id=>({gmail:'Teen · Gmail',domain:'Teen · timeservices.co',harry:'Harry'}[id]||id);
function toast(text){$('.toast').textContent=text;$('.toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('.toast').classList.remove('show'),3000)}
function mount(){
 if($('main'))return;
 app.replaceChildren($('#dashboard-template').content.cloneNode(true));
 originals={};['.kpis','.chart-card','.recent-card','.progress','.recipients','.account'].forEach(s=>originals[s]=$(s).innerHTML);
 $('.hamburger').onclick=()=>{const open=$('.sidebar').classList.toggle('open');$('.hamburger').setAttribute('aria-expanded',String(open))};
 $$('.nav button:not(.selected)').forEach(b=>b.onclick=()=>toast('เร็วๆ นี้'));
 $('.nav button.selected').onclick=()=>chooseAccount('all');
 $('.bell').setAttribute('aria-controls','notice-menu');$('.bell').setAttribute('aria-expanded','false');
 $('.bell').onclick=()=>toggleMenu('#notice-menu',$('.bell'));
 $('.avatar').onclick=()=>toggleMenu('#avatar-menu',$('.avatar'));
 $('.date-pill').onclick=()=>toast('ช่วงข้อมูลที่แสดงในแดชบอร์ด');
 $('#logout').onclick=logout;
 $('#retry-load').onclick=()=>load();
}
function showLogin(message=''){
 window.MailDetails?.close();payload=null;app.innerHTML=`<div class="login-wrap"><form class="login-card glass"><div class="avatar login-mark">T</div><h1>ใส่รหัสแดชบอร์ด</h1><p>TIME Mail · ใช้รหัสเดียวกับแดชบอร์ดบริษัท</p><label for="dashboard-key">รหัสแดชบอร์ด</label><input id="dashboard-key" name="password" type="password" autocomplete="current-password" required placeholder="ใส่รหัสแดชบอร์ด"><button type="submit">เข้าดู</button><p class="login-error" role="alert">${esc(message)}</p></form></div>`;
 $('.login-card').onsubmit=e=>{e.preventDefault();const value=$('#dashboard-key').value.trim();if(!value)return;key=value;store.set(key);load()};
}
function logout(){controller?.abort();key='';store.clear();selectedAccount='all';showLogin();}
function renderSwitcher(){
 const entries=Object.entries(payload.accounts),connected=entries.filter(([,a])=>['sending','connected'].includes(a.status)).length;
 $('.account-switcher').innerHTML=`<button class="account-chip glass" data-account="all" aria-pressed="${selectedAccount==='all'}"><span class="chip-avatar">T</span><span class="chip-copy"><strong>ทุกบัญชี</strong><small>ภาพรวมบริษัท</small><span class="status ${connected?'green':''}">เชื่อมต่อ ${connected} จาก ${entries.length}</span></span></button>`+entries.map(([id,a])=>`<button class="account-chip glass" data-account="${esc(id)}" aria-pressed="${selectedAccount===id}"><span class="chip-avatar">${id==='harry'?'H':'T'}</span><span class="chip-copy"><strong>${esc(titleFor(id))}</strong><small>${id==='harry'?'ดูจาก cc · ':''}${esc(a.address)}</small>${status(a)}</span></button>`).join('');
}
function closeMenus(){
 $$('.popover').forEach(el=>el.hidden=true);
 $$('.account-title,.bell,.avatar').forEach(el=>el.setAttribute('aria-expanded','false'));
}
function toggleMenu(selector,trigger){
 const menu=$(selector);if(!menu)return;const open=menu.hidden;closeMenus();menu.hidden=!open;trigger.setAttribute('aria-expanded',String(open));
}
function renderAccounts(empty){
 const id=selectedAccount==='all'?'gmail':selectedAccount,a=payload.accounts[id]||{},snap=a.data,harry=id==='harry';
 $('#account-menu').innerHTML=Object.entries(payload.accounts).map(([key,account])=>`<button data-account="${esc(key)}" aria-pressed="${id===key}"><span>${esc(titleFor(key))}</span>${status(account)}</button>`).join('');
 const title=harry?'Harry':id==='domain'?'timeservices.co':'Gmail บริษัท';
 const note=harry?'เห็นเฉพาะเมลที่ Harry cc ถึงพิมพ์ชนก · ไม่อ่านกล่องเมลของ Harry':id==='domain'?'รอโดเมน · จะใช้แทน Gmail เมื่อ Workspace พร้อม':'';
 const labels=harry?['เมลที่ส่งออก','ลูกค้าตอบกลับ']:['จำนวนครั้งที่ส่ง','อัตราการส่งสำเร็จ'];
 const values=harry?[snap?fmt(snap.sent):'—',snap?fmt(snap.customer_replies):'—']:[snap?fmt(snap.attempts_total):'—',snap?fmt(snap.last7?.rate)+'%':'—'];
 $('.mailbox-list').innerHTML=`<div class="account-name">${esc(title)}</div><div class="account-address">${esc(a.address||'')}</div>${note?`<div class="account-summary-note">${esc(note)}</div>`:''}<div class="account-tiles">${values.map((value,i)=>`<div class="account-tile glass">${icon(i?'trend':'mail')}<p>${labels[i]}</p><div class="num">${value}</div></div>`).join('')}</div>`;
}
function initials(name){return String(name).split(' / ')[0].split(/\s+/).filter(w=>!['CO','LTD','LIMITED','INC','CORP','COMPANY'].includes(w.toUpperCase().replace(/[^A-Z]/g,''))).slice(0,2).map(w=>Array.from(w)[0]||'').join('').toUpperCase()}
function renderMetrics(snap){
 const cards=$$('.kpi'),today=snap.today||{},isToday=sampleMode||today.date===bangkokToday(),attempts=isToday?number(today.attempts):0,rate=number(snap.last7?.rate),complete=number(today.cap)>0&&attempts>=number(today.cap);
 cards[0].querySelector('.metric').textContent=fmt(snap.sent_companies);cards[0].querySelector('.badge').textContent=`▲ +${fmt(today.delivered)} วันนี้`;
 cards[1].querySelector('.metric').innerHTML=`${fmt(attempts)}<span class="denom"> / ${fmt(today.cap)}</span>`;
 cards[1].querySelector('.kpi-label').textContent=complete?'วันนี้ครบกำหนด':'วันนี้ส่งแล้ว';cards[1].querySelector('.check').hidden=!complete;
 cards[2].querySelector('.metric').textContent=fmt(snap.pending);cards[2].querySelector('.badge').textContent=`${fmt(snap.retry)} รอส่งซ้ำ`;cards[2].querySelector('.badge').hidden=!number(snap.retry);
 cards[3].querySelector('.metric').textContent=fmt(rate)+'%';cards[3].querySelector('.kpi-note').textContent=`(${fmt(snap.last7?.delivered)} จาก ${fmt(snap.last7?.attempts)} · 7 วัน)`;
 cards[3].querySelector('.badge').textContent=rate>=95?'ดีมาก':rate>=80?'ปกติ':'ต้องดู';cards[3].querySelector('.badge').classList.toggle('warn',rate<80);
 $('.recent-list').innerHTML=(snap.recent||[]).slice(0,3).map((r,i)=>`<article class="recent-row glass" tabindex="0"><img class="building-thumb" src="/admin/tracking-mail/img/building-${i+1}.webp" alt="" aria-hidden="true" width="94" height="67"><div class="recent-copy"><strong>${esc(String(r.company||'').split(' / ')[0])}</strong><small>${esc(thaiTime(r.time))}</small></div><span class="badge"><span class="dot"></span>ส่งแล้ว</span></article>`).join('')||'<div class="empty-panel">ยังไม่มีรายการส่ง</div>';
 $('.gauge-label .num').innerHTML=`${fmt(snap.progress_pct)}<span class="percent">%</span>`;
 $('.gauge-label small').textContent=`${fmt(snap.sent_companies)} จาก ${fmt(snap.total)} บริษัท`;
 $('.gauge svg').setAttribute('aria-label',`ความคืบหน้า ${number(snap.progress_pct)} เปอร์เซ็นต์`);
 $('.gauge [pathLength]').setAttribute('stroke-dasharray',`${Math.max(0,Math.min(100,number(snap.progress_pct)))} 100`);
 $('.eta .num').textContent='~'+fmt(snap.eta_workdays);$('.pace small').textContent=`เมื่อส่งวันละ ${fmt(snap.safe_cap)} ฉบับ`;
 $('.recipient-total .num').textContent=fmt(snap.total);
 $('.recipients tbody').innerHTML=(snap.groups||[]).map(g=>`<tr><td><span class="group-dot ${{transport:'purple',partner:'grey'}[g.key]||''}"></span>${esc(({exhibitor_th:'บริษัทไทย',exhibitor_en:'บริษัทต่างชาติ',transport:'ทัวร์ / โรงแรม',partner:'ผู้จัดงาน'})[g.key]||g.label)}</td><td>${fmt(g.sent)}</td><td>${fmt(g.pending)}</td></tr>`).join('');
 drawChart(snap,selectedDays);
}
function fitChartText(){const chart=$('#daily-chart');if(chart){const r=chart.getBoundingClientRect();chart.style.setProperty('--chart-text-stretch',innerWidth<=650&&r.width?(r.height/209)/(r.width/690):1)}}
addEventListener('resize',fitChartText);
function drawChart(snap,days=14){
 const harry=selectedAccount==='harry',monthly=harry&&days>=365;
 const daily=(snap.daily||[]).map(d=>harry?{...d,delivered:d.sent}:d).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d.date)).slice().sort((a,b)=>a.date.localeCompare(b.date));
 const latest=daily.at(-1)?.date,cutoff=latest?new Date(latest+'T00:00:00Z'):new Date();cutoff.setUTCDate(cutoff.getUTCDate()-(days-1));
 const grouped={};daily.forEach(d=>{const m=d.date.slice(0,7);grouped[m]=(grouped[m]||0)+number(d.delivered)});
 const monthValues=(Array.isArray(snap.monthly)?snap.monthly:Object.entries(grouped).map(([month,sent])=>({month,sent}))).filter(d=>/^\d{4}-\d{2}$/.test(d.month)).map(d=>({date:d.month+'-01',delivered:d.sent})).sort((a,b)=>a.date.localeCompare(b.date));
 const values=monthly?(days===365?monthValues.slice(-12):monthValues):daily.filter(d=>new Date(d.date+'T00:00:00Z')>=cutoff),peak=Math.max(0,...values.map(d=>number(d.delivered))),max=harry?Math.max(5,Math.ceil(peak/5)*5):Math.max(140,Math.ceil(peak/20)*20+20);
 $('#chart-total').textContent=fmt(values.reduce((sum,d)=>sum+number(d.delivered),0));
 const end=latest?Date.parse(latest+'T00:00:00Z'):0,week=7*86400000;
 const current=daily.filter(d=>Date.parse(d.date+'T00:00:00Z')>end-week).reduce((n,d)=>n+number(d.delivered),0);
 const previous=daily.filter(d=>{const t=Date.parse(d.date+'T00:00:00Z');return t>end-2*week&&t<=end-week}).reduce((n,d)=>n+number(d.delivered),0);
 if(harry){$('#chart-note').textContent=monthly?`เมลที่ส่ง · ${days===730?'2 ปี':'1 ปี'}`:`เมลที่ส่ง · ${days} วันล่าสุด`;$('.chart-card .section-title').innerHTML=icon('chart')+(monthly?'เมลที่ Harry ส่งรายเดือน':'เมลที่ Harry ส่งรายวัน')}
 else if(previous){const change=(current-previous)/previous*100;$('#chart-note').innerHTML=`<span class="change ${change<0?'negative':''}">${change<0?'▼ −':'▲ +'}${Math.abs(change).toFixed(1)}%</span><span class="comparison">เทียบ 7 วันก่อน</span>`}
 else $('#chart-note').textContent=daily.length?'ถึงผู้รับ ตั้งแต่ '+thaiDate(daily[0].date):'ยังไม่มีข้อมูล';
 let s='<defs><linearGradient id="bar" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#7ab9fc"/><stop offset=".45" stop-color="#64aafa"/><stop offset="1" stop-color="#e6f6fd"/></linearGradient><linearGradient id="barSheen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity=".45"/><stop offset=".3" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>';
 const tickStep=harry?Math.max(1,Math.ceil(max/5)):max>280?Math.ceil(max/7/20)*20:20;
 for(let v=0;v<=max;v+=tickStep){let y=182-v/max*161;s+=`<line x1="44" x2="688" y1="${y}" y2="${y}" stroke="#e9edf3" stroke-width=".8"/><text x="35" y="${y+5}" text-anchor="end">${v}</text>`}
 const step=644/Math.max(1,values.length),labelEvery=monthly?(days===730?3:1):Math.ceil(values.length/8);
 const chartDate=d=>monthly?`${months[Number(d.slice(5,7))-1]} ${String(Number(d.slice(0,4))+543).slice(-2)}`:thaiDate(d);
 $('#daily-chart').classList.toggle('dense-chart',values.length>10);$('#daily-chart').classList.toggle('year-chart',monthly);$('#daily-chart').classList.toggle('year-one',monthly&&days===365);
 values.forEach((d,i)=>{const delivered=Math.max(0,number(d.delivered));let h=delivered/max*161,w=Math.max(1,Math.min(66,step-(step<20?2:14))),x=(harry?44:55)+i*step+(step-w)/2,y=182-h,r=Math.min(10,h,w/2);s+=`<path d="M${x} 182V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V182Z" fill="url(#bar)" stroke="#b5d5f2" stroke-width="1"/><path d="M${x+2} 181V${y+r}Q${x+2} ${y+2} ${x+r} ${y+2}H${x+w-r}Q${x+w-2} ${y+2} ${x+w-2} ${y+r}V181Z" fill="url(#barSheen)" stroke="#fff8" stroke-width=".7"/><text class="value" x="${x+w/2}" y="${y-12}" text-anchor="middle">${step>=19?delivered:''}</text><text class="date-label ${monthly&&days===365&&i!==values.length-1&&(i%2===1||i===values.length-2)?'mobile-hide':''}" data-index="${i}" x="${x+w/2}" y="204" text-anchor="middle">${i===values.length-1||(i%labelEvery===0&&values.length-1-i>=labelEvery*.7)?esc(chartDate(d.date)):""}</text>`});
 $('#daily-chart').innerHTML=s;fitChartText();$('#daily-chart').setAttribute('aria-label',values.map(d=>`${d.date}: ${number(d.delivered)} ฉบับ`).join(', ')||'ยังไม่มีข้อมูลกราฟ');
 $$('[data-days]').forEach(b=>{const active=Number(b.dataset.days)===days;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});
}
function renderEmpty(id,a){
 const harry=id==='harry',label=a?.status==='not_connected'?'ตัวอย่าง · รอเชื่อมต่อ':(statuses[a?.status]||statuses.not_connected)[0],badge=`<span class="empty-badge">${esc(label)}</span>`;
 const labels=harry?['เมลที่ส่งออก','ลูกค้าตอบกลับ','ตอบลูกค้าเฉลี่ย (ชม.)','เมลค้างตอบ']:['บริษัทที่ส่งแล้ว','วันนี้ครบกำหนด','รอส่ง','ส่งถึงผู้รับ'];
 $('.kpis').innerHTML=labels.map((label,i)=>`<article class="kpi glass" tabindex="0"${i===0?' id="kpi-first"':''}><div class="bubble">${icon(['send','mail','history','layers'][i])}</div><div class="kpi-copy"><div class="metric num">—</div><div class="kpi-label">${label}</div>${badge}</div></article>`).join('');
 $('.chart-card').innerHTML=`<div class="chart-top"><div><h2 class="section-title">${icon('chart')}${harry?'เมลที่ Harry ส่งรายวัน':'ยอดส่งรายวัน'}</h2><div class="chart-total"><span class="num">—</span><span class="unit">ฉบับ</span>${badge}</div></div></div><div class="empty-chart" aria-label="ยังไม่มีข้อมูลกราฟ">${'<div class="empty-bar skeleton"></div>'.repeat(8)}</div><div class="empty-chart-caption">${harry?'ข้อมูลจะแสดงเมื่อเชื่อมต่อบัญชี '+esc(a.address)+' · นับเฉพาะเมลที่ Harry cc มา':id==='domain'?'ข้อมูลจะแสดงเมื่อโดเมนและ Workspace พร้อม':'ข้อมูลจะแสดงเมื่อเชื่อมต่อบัญชี'}</div>`;
 $('.recent-card').innerHTML=`<div class="recent-head"><h2 class="section-title">${icon('mail')}เธรดล่าสุด</h2>${badge}</div><div class="recent-list" aria-label="ยังไม่มีข้อมูลเธรด">${'<div class="thread-skeleton"><div class="skeleton-avatar skeleton"></div><div class="skeleton-copy"><div class="skeleton"></div><div class="skeleton"></div></div></div>'.repeat(3)}</div>`;
 $('.progress').innerHTML=`<h2 class="section-title">${icon('history')}${harry?'การตอบกลับลูกค้า':'ความคืบหน้า'}</h2><div class="empty-panel"><div class="num">—</div>${badge}<p>${harry?'ยังไม่มีข้อมูลการตอบกลับ':'บัญชีนี้ยังไม่เริ่มส่งเมล'}<br>${harry?'รอเชื่อมต่อบัญชีพิมพ์ชนก':id==='domain'?'จะใช้แทน Gmail เมื่อโดเมนพร้อม':'รอข้อมูลจากบัญชีนี้'}</p></div>`;
 $('.recipients').innerHTML=`<h2 class="section-title">${icon('users')}${harry?'ลูกค้าที่ติดต่อ':'กลุ่มผู้รับ'}</h2><div class="empty-panel"><div class="num">—</div>${badge}<p>ยังไม่มีข้อมูลสำหรับบัญชีนี้<br>ไม่นำข้อมูลจากบัญชีอื่นมารวม</p></div>`;
 $('.account .section-title').insertAdjacentHTML('afterend',badge);
}

const categoryNames={payment:'ชำระเงิน',quotation:'ใบเสนอราคา',design:'ออกแบบ',production:'ผลิต',transport:'ขนส่ง',follow_up:'ติดตามลูกค้า',intro:'แนะนำบริษัท',other:'อื่น ๆ'};
function categoryKey(key){return Object.hasOwn(categoryNames,key)?key:'other'}
function renderHarryRecent(snap){
 const rows=(snap.recent||[]).filter(r=>!selectedHarryCategory||r.category===selectedHarryCategory).slice(0,3);
 $('.recent-card').innerHTML=`<div class="recent-head"><h2 class="section-title">${icon('mail')}เธรดล่าสุด</h2>${selectedHarryCategory?'<button class="clear-category all-link">ทุกหมวด</button>':''}</div><div class="recent-list">${rows.map(r=>`<article class="recent-row glass" tabindex="0"><div class="initials" aria-hidden="true">${esc(initials(r.customer))}</div><div class="recent-copy"><strong>${esc(r.subject||'(ไม่มีหัวข้อ)')}</strong><span class="category-tag cat-${categoryKey(r.category)}">${categoryNames[categoryKey(r.category)]}</span><small>${esc(r.customer)} · ${esc(thaiTime(r.time))}</small></div><span class="badge ${r.last_from==='customer'?'warn':''}">${r.last_from==='customer'?'รอ Harry ตอบ':'ตอบแล้ว'}</span></article>`).join('')||'<div class="empty-panel">ไม่มีเธรดล่าสุดในหมวดนี้</div>'}</div><p class="coverage-note">เห็นเฉพาะเมลที่ Harry cc ถึงพิมพ์ชนก (${number(snap.days)===730?'2 ปี':number(snap.days)===365?'1 ปี':fmt(snap.days)+' วัน'})</p>`;
}
function renderHarryCategories(snap,coverage){
 const categories=(Array.isArray(snap.categories)?snap.categories:[]).slice().sort((a,b)=>number(b.threads)-number(a.threads));
 const maximum=Math.max(1,...categories.map(c=>number(c.threads)));
 $('.progress').innerHTML=`<h2 class="section-title">${icon('grid')}แยกตามหมวดหมู่</h2><div class="category-list">${categories.map(c=>`<button class="category-row cat-${categoryKey(c.key)}" data-category="${esc(c.key)}" aria-pressed="${selectedHarryCategory===c.key}" title="${esc(c.label)} · ${fmt(c.threads)} เธรด · ส่ง ${fmt(c.sent)} ครั้ง"><span class="category-label">${esc(c.label)}</span><span class="category-count">${fmt(c.threads)} <small>เธรด</small></span><span class="category-track"><i style="width:${Math.max(0,Math.min(100,number(c.threads)/maximum*100))}%"></i></span><span class="category-meta">ตอบกลับ ${fmt(c.customer_replies)} · ค้าง ${fmt(c.waiting_reply)}</span></button>`).join('')||'<div class="empty-panel">ยังไม่มีข้อมูลหมวดหมู่</div>'}</div><p class="coverage-note">${esc(coverage)}</p>`;
}
function renderHarry(snap,account){
 renderEmpty('harry',account);
 const coverage=`เห็นเฉพาะเมลที่ Harry cc ถึงพิมพ์ชนก (${number(snap.days)===730?'2 ปี':number(snap.days)===365?'1 ปี':fmt(snap.days)+' วัน'})`;
 const note=`<p class="coverage-note">${esc(coverage)}</p>`;
 const values=[snap.sent,snap.customer_replies,snap.avg_reply_hours,snap.waiting_reply];
 $$('.kpi').forEach((card,i)=>{
  card.querySelector('.metric').textContent=values[i]==null?'—':fmt(values[i]);
  card.querySelector('.empty-badge').remove();
  if(i===3&&number(snap.waiting_reply)>0)card.querySelector('.kpi-copy').insertAdjacentHTML('beforeend','<span class="badge warn">รอ Harry ตอบ</span>');
  card.insertAdjacentHTML('beforeend',note);
 });
 $('.chart-card').innerHTML=originals['.chart-card'];
 $('.chart-card .section-title').innerHTML=icon('chart')+'เมลที่ Harry ส่งรายเดือน';
 $('.segments').innerHTML=[30,365,730].map(d=>`<button data-days="${d}" aria-pressed="${d===selectedHarryDays}" class="${d===selectedHarryDays?'active':''}">${d===730?'2 ปี':d===365?'1 ปี':d+' วัน'}</button>`).join('');
 $('.chart-card').insertAdjacentHTML('beforeend',note);
 renderHarryRecent(snap);
 renderHarryCategories(snap,coverage);
 $('.recipients').innerHTML=`<h2 class="section-title">${icon('users')}ลูกค้าที่ติดต่อ</h2><div class="empty-panel"><div class="num">${fmt(snap.customers)}</div><p>ลูกค้าที่ติดต่อ<br>ไม่นำข้อมูลจากบัญชีอื่นมารวม</p></div>${note}`;
 $('.account>.empty-badge')?.remove();$('.account').insertAdjacentHTML('beforeend',note);
 drawChart(snap,selectedHarryDays);
}

function chooseAccount(id){
 if(!payload)return;
 window.MailDetails?.close();
 if(id!=='harry')selectedHarryCategory=null;
 selectedAccount=id;const account=payload.accounts[id==='all'?'gmail':id],snap=account?.data,empty=!snap,harry=id==='harry';
 $('main').classList.toggle('placeholder-view',empty||harry);
 $('main').classList.toggle('harry-live',harry&&!empty);
 Object.entries(originals).forEach(([s,v])=>$(s).innerHTML=v);
 $('h1').textContent=harry?'ติดตามผลงาน Harry':id==='domain'?'ภาพรวมบัญชีบริษัท':'ภาพรวมระบบส่งเมล';
 const statusLabel=(statuses[account?.status]||statuses.not_connected)[0];
 $('.subtitle').textContent=harry?`ดูจากเมลที่ cc ถึง ${account?.address||'—'} · ${account?.status==='not_connected'?'รอเชื่อมต่อ':statusLabel}`:id==='domain'?`Teen · timeservices.co · ${statusLabel}`:'Email Dashboard';
 if(sampleMode&&harry&&payload._sample)$('.subtitle').textContent='ตัวอย่างข้อมูล · '+$('.subtitle').textContent;
 renderSwitcher();renderAccounts(empty);
 if(empty)renderEmpty(id,account);else if(harry)renderHarry(snap,account);else renderMetrics(snap);
 const headerSnap=snap||payload.accounts.gmail?.data;
 const first=(headerSnap?.daily||[]).map(d=>d.date).sort()[0];
 const range=first?`${thaiDate(first,harry)} – ${thaiDate(headerSnap.as_of,true)}`:'—';$('.date-pill span').textContent=range;$('.date-pill').setAttribute('aria-label','ช่วงวันที่ '+range);
 $('#updated-at').textContent=headerSnap?.as_of?'อัปเดตล่าสุด '+thaiTime(headerSnap.as_of):'ยังไม่มีข้อมูลอัปเดต';
 const updated=account?.updated_at??payload.accounts.gmail?.updated_at;
 $('#stale').hidden=!(updated!=null&&(sampleMode?number(payload.generated_at):Date.now()/1000)-number(updated)>3*60*60);
 $('#retry-load').hidden=true;
 $('.bell').classList.toggle('is-stale',!$('#stale').hidden);$('.bell').title=$('#stale').hidden?$('#updated-at').textContent:$('#stale').textContent;
 $('.notice-clicks').textContent=`ติดตามลิงก์ ${fmt(payload.clicks?.sent)} · กดลิงก์ ${fmt(payload.clicks?.clicked)} · เข้าดูเว็บ ${fmt(payload.clicks?.opened)} · สแกนเนอร์ ${fmt(payload.clicks?.scanner_only)}`;
 closeMenus();syncHash();window.MailDetails?.bind();
}
function syncHash(){$$('.glass').forEach(el=>el.classList.toggle('is-active',location.hash==='#hover-all'))}
addEventListener('hashchange',syncHash);
document.addEventListener('click',event=>{
 const category=event.target.closest('[data-category]'),clearCategory=event.target.closest('.clear-category');
 if((category||clearCategory)&&selectedAccount==='harry'){
  selectedHarryCategory=clearCategory||selectedHarryCategory===category?.dataset.category?null:category.dataset.category;
  const snap=payload.accounts.harry?.data;if(snap){renderHarryRecent(snap);renderHarryCategories(snap,`เห็นเฉพาะเมลที่ Harry cc ถึงพิมพ์ชนก (${number(snap.days)===730?'2 ปี':number(snap.days)===365?'1 ปี':fmt(snap.days)+' วัน'})`);syncHash();window.MailDetails?.bind();if(category)window.MailDetails?.open($('.progress'))}return;
 }
 if(event.target.closest('.account-title')){toggleMenu('#account-menu',$('.account-title'));return}
 if(!event.target.closest('.popover,.bell,.avatar,.account-title'))closeMenus();
 const account=event.target.closest('[data-account]');if(account){chooseAccount(account.dataset.account);return}
 const days=event.target.closest('[data-days]');if(days){const range=Number(days.dataset.days);if(selectedAccount==='harry')selectedHarryDays=range;else selectedDays=range;const snap=payload?.accounts[selectedAccount==='all'?'gmail':selectedAccount]?.data;if(snap)drawChart(snap,range);return}
 if(event.target.closest('.all-link')){window.MailDetails?.open($('.recent-card'));return}
 const glass=event.target.closest('.glass');if(glass&&!event.target.closest('[data-detail-card],button,input,form,.popover'))glass.classList.toggle('is-active');
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeMenus();return}if(event.target.matches('.glass[tabindex]')&&!event.target.matches('[data-detail-card],.recent-row,.account-tile')&&['Enter',' '].includes(event.key)){event.preventDefault();event.target.classList.toggle('is-active')}});
async function load(){
 controller?.abort();const request=new AbortController();controller=request;
 if(!sampleMode&&!key){showLogin();return}
 mount();if(!payload){$('main').classList.add('loading-view');$('main').setAttribute('aria-busy','true')}
 const timeout=setTimeout(()=>request.abort(),25000);
 try{
  const response=await fetch(sampleMode?(sampleParam==='harry'?'/admin/tracking-mail/sample-harry.json':'/admin/tracking-mail/sample-dashboard.json'):'/api/mail-dashboard',{cache:'no-store',headers:sampleMode?{}:{Authorization:'Bearer '+key},signal:request.signal});
  if(controller!==request)return;
  if(response.status===401){key='';store.clear();showLogin('รหัสไม่ถูกต้อง ลองอีกครั้ง');return}
  if(!response.ok)throw new Error('HTTP '+response.status);
  const result=await response.json();if(controller!==request)return;
  if(!result||!result.accounts||typeof result.accounts!=='object')throw new Error('Invalid response');
  payload=result;$('main').classList.remove('loading-view');$('main').setAttribute('aria-busy','false');chooseAccount(selectedAccount);
 }catch(error){
  if(controller!==request)return;
  if(!sampleMode&&!key)return;
  const message='โหลดข้อมูลไม่สำเร็จ กรุณาลองใหม่';toast(message);
  if($('main')){$('main').setAttribute('aria-busy','false');$('#updated-at').textContent=message;$('#retry-load').hidden=false;}
 }finally{clearTimeout(timeout)}
}
load();setInterval(()=>{if(sampleMode||key)load()},5*60*1000);

</script><script src="/admin/tracking-mail/drawers.js"></script></body></html>
