'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const app=$('#app'), sampleParam=new URLSearchParams(location.search).get('sample'), sampleMode=['1','harry'].includes(sampleParam);
const store={get(){try{return localStorage.getItem('ts_dash_key')||''}catch{return ''}},set(v){try{localStorage.setItem('ts_dash_key',v)}catch{}},clear(){try{localStorage.removeItem('ts_dash_key')}catch{}}};
let key=store.get(), payload=null, selectedAccount=sampleParam==='harry'?'harry':'all', selectedDays=14, selectedHarryDays=730, selectedHarryCategory=null, originals={}, controller=null, toastTimer;

const months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thaiDate(value,year=false,pad=false){const match=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(!match)return '—';return `${pad?match[3]:Number(match[3])} ${months[Number(match[2])-1]||''}${year?' '+match[1]:''}`}
function thaiTime(value){const t=String(value||'').match(/T(\d{2}:\d{2})/);return `${thaiDate(value,true,true)}${t?' · '+t[1]+' น.':''}`}
const bangkokToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const statuses={sending:['กำลังส่ง','green'],connected:['เชื่อมต่อแล้ว','green'],waiting_domain:['รอโดเมน','amber'],not_connected:['ยังไม่เชื่อมต่อ',''],error:['มีปัญหา','red']};
function status(a){const s=statuses[a?.status]||statuses.not_connected;return `<span class="status ${s[1]}">${s[0]}</span>`}

 if($('main'))return;

function drawChart(snap,days=14){

 const latest=daily.at(-1)?.date,cutoff=latest?new Date(latest+'T00:00:00Z'):new Date();cutoff.setUTCDate(cutoff.getUTCDate()-(days-1));

 const end=latest?Date.parse(latest+'T00:00:00Z'):0,week=7*86400000;

 const previous=daily.filter(d=>{const t=Date.parse(d.date+'T00:00:00Z');return t>end-2*week&&t<=end-week}).reduce((n,d)=>n+number(d.delivered),0);
 if(harry){$('#chart-note').textContent=monthly?`เมลที่ส่ง · ${days===730?'2 ปี':'1 ปี'}`:`เมลที่ส่ง · ${days} วันล่าสุด`;$('.chart-card .section-title').innerHTML=icon('chart')+(monthly?'เมลที่ Harry ส่งรายเดือน':'เมลที่ Harry ส่งรายวัน')}

 else $('#chart-note').textContent=daily.length?'ถึงผู้รับ ตั้งแต่ '+thaiDate(daily[0].date):'ยังไม่มีข้อมูล';
 const box=$('#daily-chart').getBoundingClientRect(),W=box.width>40&&box.height>40?Math.max(420,Math.round(209*box.width/box.height)):690;$('#daily-chart').setAttribute('viewBox',`0 0 ${W} 209`);
 let s='<defs><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b5dbff"/><stop offset=".38" stop-color="#5aa4ff"/><stop offset="1" stop-color="#2167e2"/></linearGradient><linearGradient id="barSheen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="gapRed" cx=".35" cy=".3"><stop stop-color="#ffe3e5"/><stop offset=".4" stop-color="#ff7079"/><stop offset="1" stop-color="#d9283a"/></radialGradient></defs>';
 const tickStep=harry?Math.max(1,Math.ceil(max/5)):max>280?Math.ceil(max/7/20)*20:20;
 for(let v=0;v<=max;v+=tickStep){let y=182-v/max*161;s+=`<line class="${v?'grid':'base'}" x1="44" x2="${W-2}" y1="${y}" y2="${y}"/><text class="tick" x="35" y="${y+5}" text-anchor="end">${v}</text>`}
 const step=(W-46)/Math.max(1,values.length),labelEvery=monthly?(days===730?3:1):Math.ceil(values.length/(innerWidth<=650?8:12));
 const chartDate=d=>monthly?`${months[Number(d.slice(5,7))-1]} ${String(Number(d.slice(0,4))+543).slice(-2)}`:thaiDate(d);

 values.forEach((d,i)=>{const delivered=Math.max(0,number(d.delivered));let h=delivered/max*161,w=Math.max(1,Math.min(66,step-(step<20?2:14))),x=(harry?44:55)+i*step+(step-w)/2,y=182-h,r=Math.min(10,h,w/2);s+=`<g data-mail-bar="${esc(JSON.stringify(harry?{account:'harry',...(monthly?{month:d.date.slice(0,7)}:{day:d.date}),direction:'harry'}:{account:'gmail',day:d.date,direction:'sent'}))}" role="button" tabindex="0" aria-label="${esc(d.date)}: ${d.gap?'ไม่ได้ส่ง (วันทำการ)':delivered+' '+(harry?'ส่งออก':'ส่งถึง')} · อ่านเมลส่งออกทั้งหมดของช่วงนี้"><title>${esc(d.date)}: ${d.gap?'ไม่ได้ส่ง':delivered+' ฉบับ'}</title><rect x="${x}" y="${Math.min(y-15,162)}" width="${w}" height="${Math.max(h+20,25)}" fill="transparent"/>${h>0?`<g class="bar" style="--i:${i}"><path d="M${x} 182V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V182Z" fill="url(#bar)"/><path d="M${x+2} 181V${y+r}Q${x+2} ${y+2} ${x+r} ${y+2}H${x+w-r}Q${x+w-2} ${y+2} ${x+w-2} ${y+r}V181Z" fill="url(#barSheen)" stroke="#fff" stroke-opacity=".55" stroke-width=".7"/></g>`:''}${d.gap?`<circle class="gapdot" cx="${x+w/2}" cy="182" r="4.5" fill="url(#gapRed)"/>`:''}<text class="value${d.gap?' gap':''}" style="--i:${i}" x="${x+w/2}" y="${y-12}" text-anchor="middle">${step>=19?delivered:''}</text><text class="date-label ${monthly&&days===365&&i!==values.length-1&&(i%2===1||i===values.length-2)?'mobile-hide':''}" data-index="${i}" x="${x+w/2}" y="204" text-anchor="middle">${i===values.length-1||(i%labelEvery===0&&values.length-1-i>=labelEvery*.7)?esc(chartDate(d.date)):""}</text></g>`});

function renderHarry(snap,account){
 renderEmpty('harry',account);
 const coverage=`เห็นเฉพาะเมลที่ Harry cc ถึงพิมพ์ชนก (${number(snap.days)===730?'2 ปี':number(snap.days)===365?'1 ปี':fmt(snap.days)+' วัน'})`;
 const note=`<p class="coverage-note">${esc(coverage)}</p>`;
 const values=[snap.sent,snap.customer_replies,snap.avg_reply_hours,snap.waiting_reply];
 $$('.kpi').forEach((card,i)=>{
  card.querySelector('.metric').textContent=values[i]==null?'—':fmt(values[i]);
  card.querySelector('.empty-badge').remove();
  if(i===3&&number(snap.waiting_reply)>0)card.querySelector('.kpi-copy').insertAdjacentHTML('beforeend','<span class="badge warn">รอ Harry ตอบ</span>');
  card.insertAdjacentHTML('beforeend',note);
 });
 $('.chart-card').innerHTML=originals['.chart-card'];
 $('.chart-card .section-title').innerHTML=icon('chart')+'เมลที่ Harry ส่งรายเดือน';
 $('.segments').innerHTML=[30,365,730].map(d=>`<button data-days="${d}" aria-pressed="${d===selectedHarryDays}" class="${d===selectedHarryDays?'active':''}">${d===730?'2 ปี':d===365?'1 ปี':d+' วัน'}</button>`).join('');
 $('.chart-card').insertAdjacentHTML('beforeend',note);
 renderHarryRecent(snap);
 renderHarryCategories(snap,coverage);
 $('.recipients').innerHTML=`<h2 class="section-title">${icon('users')}ลูกค้าที่ติดต่อ</h2><div class="empty-panel"><div class="num">${fmt(snap.customers)}</div><p>ลูกค้าที่ติดต่อ<br>ไม่นำข้อมูลจากบัญชีอื่นมารวม</p></div>${note}`;
 $('.account>.empty-badge')?.remove();$('.account').insertAdjacentHTML('beforeend',note);
 drawChart(snap,selectedHarryDays);
}

function normalizeQuantities(){
 const s=payload?.accounts?.gmail?.data;if(!s)return;
 const ratio=(a,b)=>a!=null&&b!=null&&Number.isFinite(Number(a))&&Number(b)>0?Math.round(Number(a)/Number(b)*1000)/10:null;
 s.progress_pct=ratio(s.sent_companies,s.total);
 if(s.last7)s.last7.rate=ratio(s.last7.delivered,s.last7.attempts);
 if(s.pending!=null&&Number(s.safe_cap)>0)s.eta_workdays=Math.ceil(Number(s.pending)/Number(s.safe_cap));
}
function chooseAccount(id){
 if(!payload)return;
 normalizeQuantities();
 window.MailReader?.close();window.MailDetails?.close();
 if(id!=='harry')selectedHarryCategory=null;
 selectedAccount=id;const account=payload.accounts[id==='all'?'gmail':id],snap=account?.data,empty=!snap,harry=id==='harry';
 $('main').classList.toggle('placeholder-view',empty||harry);
 $('main').classList.toggle('harry-live',harry&&!empty);
 Object.entries(originals).forEach(([s,v])=>$(s).innerHTML=v);
 $('h1').textContent='ภาพรวม';$('.acct-switch span').textContent=id==='all'?'ทุกบัญชี':titleFor(id);
 const statusLabel=(statuses[account?.status]||statuses.not_connected)[0];
 $('.subtitle').textContent=harry?`ติดตามผลงาน Harry · ดูจากเมลที่ cc ถึง ${account?.address||'—'} · ${account?.status==='not_connected'?'รอเชื่อมต่อ':statusLabel}`:id==='domain'?`ภาพรวมบัญชีบริษัท · Teen · timeservices.co · ${statusLabel}`:'ภาพรวมระบบส่งเมลของคุณ ติดตามผลส่งและความคืบหน้า อัปเดตทุก 5 นาที';
 if(sampleMode&&harry&&payload._sample)$('.subtitle').textContent='ตัวอย่างข้อมูล · '+$('.subtitle').textContent;
 renderSwitcher();renderAccounts(empty);
 if(empty)renderEmpty(id,account);else if(harry)renderHarry(snap,account);else renderMetrics(snap);
 const headerSnap=snap||payload.accounts.gmail?.data;
 const first=(headerSnap?.daily||[]).map(d=>d.date).sort()[0];
 const range=first?`${thaiDate(first,harry)} – ${thaiDate(headerSnap.as_of,true)}`:'—';$('.date-pill span').textContent=range;$('.date-pill').setAttribute('aria-label','ช่วงวันที่ '+range);
 $('#updated-at').textContent=headerSnap?.as_of?'อัปเดตล่าสุด '+thaiTime(headerSnap.as_of):'ยังไม่มีข้อมูลอัปเดต';
 const updated=account?.updated_at??payload.accounts.gmail?.updated_at;
 $('#stale').hidden=!(updated!=null&&(sampleMode?number(payload.generated_at):Date.now()/1000)-number(updated)>3*60*60);
 $('#retry-load').hidden=true;
 $('.bell').classList.toggle('is-stale',!$('#stale').hidden);$('.bell').title=$('#stale').hidden?$('#updated-at').textContent:$('#stale').textContent;
 $('.notice-clicks').textContent=`ติดตามลิงก์ ${fmt(payload.clicks?.sent)} · กดลิงก์ ${fmt(payload.clicks?.clicked)} · เข้าดูเว็บ ${fmt(payload.clicks?.opened)} · สแกนเนอร์ ${fmt(payload.clicks?.scanner_only)}`;
 closeMenus();syncHash();window.MailDetails?.bind();window.MailPages?.render();
}
function syncHash(){$$('.glass').forEach(el=>el.classList.toggle('is-active',location.hash==='#hover-all'))}
addEventListener('hashchange',syncHash);
document.addEventListener('click',event=>{
 const category=event.target.closest('[data-category]'),clearCategory=event.target.closest('.clear-category');
 if((category||clearCategory)&&selectedAccount==='harry'){
  selectedHarryCategory=clearCategory||selectedHarryCategory===category?.dataset.category?null:category.dataset.category;
  const snap=payload.accounts.harry?.data;if(snap){renderHarryRecent(snap);renderHarryCategories(snap,`เห็นเฉพาะเมลที่ Harry cc ถึงพิมพ์ชนก (${number(snap.days)===730?'2 ปี':number(snap.days)===365?'1 ปี':fmt(snap.days)+' วัน'})`);syncHash();window.MailDetails?.bind();if(category)window.MailDetails?.open($('.progress'))}return;
 }
 if(event.target.closest('.account-title')){toggleMenu('#account-menu',$('.account-title'));return}
 if(event.target.closest('.acct-switch')){toggleMenu('#switch-menu',$('.acct-switch'));return}
 if(!event.target.closest('.popover,.bell,.avatar,.account-title,.acct-switch'))closeMenus();
 const account=event.target.closest('[data-account]');if(account){chooseAccount(account.dataset.account);return}
 const days=event.target.closest('[data-days]');if(days){const range=Number(days.dataset.days);if(selectedAccount==='harry')selectedHarryDays=range;else selectedDays=range;const snap=payload?.accounts[selectedAccount==='all'?'gmail':selectedAccount]?.data;if(snap)drawChart(snap,range);return}
 if(event.target.closest('.all-link')){window.MailDetails?.open($('.recent-card'));return}
 const glass=event.target.closest('.glass');if(glass&&!event.target.closest('[data-detail-card],button,input,form,.popover'))glass.classList.toggle('is-active');
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeMenus();return}if(event.target.matches('.glass[tabindex]')&&!event.target.matches('[data-detail-card],.recent-row,.account-tile')&&['Enter',' '].includes(event.key)){event.preventDefault();event.target.classList.toggle('is-active')}});
async function load(){
 controller?.abort();const request=new AbortController();controller=request;
 if(!sampleMode&&!key){showLogin();return}
 mount();if(!payload){$('main').classList.add('loading-view');$('main').setAttribute('aria-busy','true')}
 const timeout=setTimeout(()=>request.abort(),25000);
 try{
  const response=await fetch(sampleMode?(sampleParam==='harry'?'/admin/tracking-mail/sample-harry.json':'/admin/tracking-mail/sample-dashboard.json'):'/api/mail-dashboard',{cache:'no-store',headers:sampleMode?{}:{Authorization:'Bearer '+key},signal:request.signal});
  if(controller!==request)return;
  if(response.status===401){key='';store.clear();showLogin('รหัสไม่ถูกต้อง ลองอีกครั้ง');return}
  if(!response.ok)throw new Error('HTTP '+response.status);
  const result=await response.json();if(controller!==request)return;
  if(!result||!result.accounts||typeof result.accounts!=='object')throw new Error('Invalid response');
  payload=result;$('main').classList.remove('loading-view');$('main').setAttribute('aria-busy','false');chooseAccount(selectedAccount);window.Campaigns?.render();
 }catch(error){
  if(controller!==request)return;
  if(!sampleMode&&!key)return;
  const message='โหลดข้อมูลไม่สำเร็จ กรุณาลองใหม่';toast(message);
  if($('main')){$('main').setAttribute('aria-busy','false');$('#updated-at').textContent=message;$('#retry-load').hidden=false;}
 }finally{clearTimeout(timeout)}
}
load();setInterval(()=>{if(sampleMode||key)load()},5*60*1000);
